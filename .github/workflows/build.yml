name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag name (default libuavs3d version)'
        default: ''


jobs:
  build:
    permissions:
      contents: write
    uses: mpvkit/BuildShared/.github/workflows/build.yml@main
    secrets: inherit
    with:
      version: '${{ github.event.inputs.version }}'
      library: 'libuavs3d'
      # GitHub retired the macOS 14 runner images on 2026-11-02
      macos_15: true
